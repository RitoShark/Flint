[package]
name = "hematite-flint"
version = "0.1.0"
edition = "2021"

[dependencies]
# Hematite skin-fixer engine. Pinned at Hematite main rev de6291b, whose rs_*
# pins MATCH the workspace `ritoshark` rev — that's what keeps Cargo.lock at ONE
# copy of each rs_* crate. When bumping either side, bump the other to the same
# RitoShark-Crates rev and verify the lock has no duplicate rs_* entries; two
# copies double the build and make their types mutually incompatible.
hematite-orchestrate = { git = "https://github.com/RitoShark/Hematite", rev = "de6291b" }
hematite-core = { git = "https://github.com/RitoShark/Hematite", rev = "de6291b" }
hematite-file = { git = "https://github.com/RitoShark/Hematite", rev = "de6291b" }
hematite-live = { git = "https://github.com/RitoShark/Hematite", rev = "de6291b" }
hematite-types = { git = "https://github.com/RitoShark/Hematite", rev = "de6291b" }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Flint's shared HTTP stack (same pin as the binary crate — one rustls/ring copy).
# `blocking` because config loading runs inside the command's spawn_blocking —
# same TLS stack (rustls-no-provider + ring) as the binary crate, just the
# blocking wrapper. No second HTTP stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "blocking"] }
