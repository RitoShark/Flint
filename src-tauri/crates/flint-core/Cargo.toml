[package]
name = "flint-core"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.0", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time"] }
# Same major as tauri-plugin-updater's reqwest so ONE HTTP stack compiles.
# `rustls-no-provider` avoids the heavy aws-lc-sys default provider; the ring
# provider below is what actually does the crypto (same setup as tauri-plugin-updater).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# Concurrency
rayon = "1.10"
dashmap = "6.0"
parking_lot = "0.12"

# Fast hashing for u64-keyed maps in resolve_hashes_lmdb_bulk. Keys are already
# xxh64 hashes — SipHash on top of them is wasted CPU.
rustc-hash = "2"

# league-toolkit format crates (tex/mesh/meta/ritobin/anim/file): FULLY REMOVED.
# Flint's format handling is now 100% on ritoshark (tex/mesh/anim/file/rst/bin/wad).
# With Hematite removed (2026-07-14) league-toolkit is fully out of the tree; the
# league-mod crates below are unrelated to the format migration.

# RitoShark crates (owner's workspace — migrating off league-toolkit onto these).
# Pinned to main HEAD; bump as the owner pushes (WadBuilder, etc.). Default features = all formats.
ritoshark = { git = "https://github.com/RitoShark/RitoShark-Crates", rev = "daff556", features = ["rman-verify"] }

# league-mod crates (still on crates.io — removed from league-toolkit monorepo)
ltk_mod_project = "0.2"
ltk_mod_core = "0.1"
ltk_fantome = "0.2"
ltk_modpkg = { version = "0.2", features = ["project"] }
ltk_inibin = { path = "../ltk_inibin", features = ["serde"] }
flint-formats = { path = "../flint-formats" }
flint-hash = { path = "../flint-hash" }
flint-net = { path = "../flint-net" }
flint-bin = { path = "../flint-bin" }
flint-wad = { path = "../flint-wad" }
# 0.4 matches image_dds's pin so only ONE copy of the ISPC kernels compiles.
intel_tex_2 = "0.4"


# Hematite fixer: REMOVED 2026-07-14 (skin fixing disabled; owner is reworking
# Hematite — its league-toolkit crate became hematite-file at rev 025c8ce). When it
# returns, re-add hematite-types/core/file pinned to one rev and make sure its
# rs_* pins match Flint's ritoshark rev (else duplicate rs_* copies compile).

# LMDB via heed — memory-mapped B-tree DB for fast hash lookups
heed = "0.20"

# Memory-mapped file I/O for WAD extraction
memmap2 = "0.9"

# Binary/codec
byteorder = "1.4"
flate2 = "1.0"
zstd = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Filesystem/path
camino = "1.1"
walkdir = "2.4"
directories = "5.0"

# Hashing/crypto (checkpoint content digests)
sha2 = "0.10.9"

# Text/data
regex = "1.12.2"
indexmap = { version = "2.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4"] }

# Image
image = { version = "0.25", default-features = false, features = ["dds", "png", "webp"] }
image_dds = "0.6"
ddsfile = "0.5"
base64 = "0.22"

# ZIP
zip = { version = "2.4", features = ["deflate"] }

# Logging (tracing macros only)
tracing = "0.1"

# Windows registry access (Windows only)
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
