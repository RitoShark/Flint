[workspace]
members = [".", "crates/flint-core", "crates/flint-formats", "crates/flint-hash", "crates/flint-net", "crates/flint-bin", "crates/flint-wad", "crates/ltk_inibin", "crates/hematite-flint"]

[package]
name = "flint"
version = "2.5.0"
edition = "2021"
default-run = "flint"

[lib]
name = "flint"
path = "src/lib.rs"

[[bin]]
name = "flint"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core library (all format/domain deps live here)
flint-core = { path = "crates/flint-core" }
ltk_inibin = { path = "crates/ltk_inibin", features = ["serde"] }
# Skin-fixer engine (wraps Hematite's hematite-orchestrate). Its hematite deps
# pin rs_* at daff556 — IDENTICAL to ritoshark below — so ONE copy of rs_* compiles.
hematite-flint = { path = "crates/hematite-flint" }
# RST: MIGRATED to ritoshark::rst (Phase 4) — the standalone dep was removed.
# RitoShark crates — migration target. Binary-crate commands use ritoshark types directly;
# same git rev as flint-core's dep, so cargo compiles ONE shared copy (identical types across crates).
ritoshark = { git = "https://github.com/RitoShark/RitoShark-Crates", rev = "8a4f03f", features = ["rman-verify"] }
# 0.4 matches image_dds's pin so only ONE copy of the ISPC kernels compiles
# (0.4 and 0.5 have identical Surface/bc1 APIs).
intel_tex_2 = "0.4"
flate2 = "1.0"

# Tauri framework
tauri = { version = "2.11", features = ["protocol-asset", "devtools"] }
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time"] }
# Same major as tauri-plugin-updater's reqwest so ONE HTTP stack compiles.
# `rustls-no-provider` + the explicit ring pin in flint-core avoids compiling the
# heavy aws-lc-sys default provider (mirrors tauri-plugin-updater's TLS setup).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Concurrency
parking_lot = "0.12"
rayon = "1.10"
dashmap = "6"

# Fast hashing for u64-keyed maps (avoid SipHash on already-hashed xxh64 keys).
# Keys in `load_all_wad_chunks` Phase 2 dedup + the resolver's per-thread maps
# are xxh64 outputs; SipHash-1-3 on top of them is 5-10× slower than FxHash.
rustc-hash = "2"

# Hashing (matches flint-core's version — used by extract_hashes)
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Logging
#
# NOTE: deliberately NO `release_max_level_info` feature — it compile-time
# strips `tracing::debug!` in release builds, which made the Settings
# "Verbose logging" toggle a silent no-op in the shipped app (exactly when
# users need it to diagnose issues). Disabled debug! callsites are cheap at
# runtime (callsite-cached filter check) while the level stays at `info`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Data / text
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2.1", features = ["serde"] }
regex = "1.12.2"
uuid = { version = "1.20.0", features = ["v4"] }
semver = "1.0"

# Image processing (used directly by commands/file.rs)
image = { version = "0.25", default-features = false, features = ["dds", "png", "webp"] }
image_dds = "0.6"
ddsfile = "0.5"
base64 = "0.22"

# Filesystem
walkdir = "2.4"
notify = "7.0"
notify-debouncer-full = "0.4"
opener = "0.7"

# ZIP (fantome export/import)
zip = { version = "2.4", features = ["deflate"] }
psd = "0.3.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
libloading = "0.8"
# Same version as tauri's `tao` so only one copy of the windows crate compiles.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

# =============================================================================
# BUILD PROFILES - Optimized for fast incremental compilation
# =============================================================================

# Development profile - fastest incremental rebuilds
[profile.dev]
# Minimal optimization for your code (fastest compile)
opt-level = 1
# More codegen units = more parallelism during compilation
codegen-units = 256
# Enable incremental compilation
incremental = false
# No debug info by default (faster linking), set to 2 for debugging
debug = 1

# Optimize dependencies even in dev mode (they don't change often)
# This makes your app run faster without slowing down your code changes
[profile.dev.package."*"]
opt-level = 1
codegen-units = 256

# Release-dev profile - for testing with optimizations (NO slow LTO)
# Use: cargo build --profile release-dev
[profile.release-dev]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 16
incremental = true
debug = 1
strip = false

# Full release profile - slow build, maximum performance
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
