<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flint Startup</title>
    <style>
      :root {
        color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; background: #0b0d10; color: #f4f4f6;
        /* Fallback only — the inline bootstrap below overwrites this with the user's
           saved accent. Keep in sync with --accent-primary in themes/default.css. */
        --flint-accent: #DD8515;
        /* The glow behind the logo only. Neutral rather than the accent: the
           orange wash tinted the whole panel and fought the logo's own colour.
           Everything else here still uses --flint-accent. */
        --flint-glow: #8b93a1;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0d10; user-select: none; }
      button { font: inherit; }
      .startup {
        position: relative; width: 100%; height: 100%; overflow: hidden; border: 1px solid #2d2527;
        background: radial-gradient(circle at 50% 30%, color-mix(in oklab, var(--flint-glow) 17%, transparent), transparent 34%), linear-gradient(180deg, #101014 0%, #0a0b0e 100%);
      }
      .startup::before {
        content: ""; position: absolute; inset: 0; opacity: .22; pointer-events: none;
        background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
        background-size: 24px 24px; mask-image: linear-gradient(to bottom, black, transparent 76%);
      }
      .visual { position: absolute; inset: 0 0 142px; display: grid; place-items: end center; padding-bottom: 44px; transform: translateY(52px); }
      .visual__aura {
        position: absolute; width: 320px; height: 260px; border-radius: 50%;
        background: radial-gradient(circle, color-mix(in oklab, var(--flint-glow) 27%, transparent), color-mix(in oklab, var(--flint-glow) 5%, transparent) 46%, transparent 72%);
        filter: blur(10px); animation: aura 3.6s ease-in-out infinite;
      }
      .brand { position: relative; display: flex; flex-direction: column; align-items: center; gap: 13px; width: 100%; }
      .brand__logo {
        width: 166px; height: 166px; display: block; margin-inline: auto;
        filter: drop-shadow(0 12px 24px rgba(0,0,0,.42)) drop-shadow(0 0 18px color-mix(in oklab, var(--flint-glow) 15%, transparent));
        transform-origin: center; animation: logo-pop .6s cubic-bezier(.34,1.56,.64,1) both;
      }
      .brand__name { display: flex; align-items: baseline; justify-content: center; width: 100%; color: #f1f3f6; font-size: 30px; font-weight: 650; letter-spacing: .035em; }
      .brand__word { display: inline-block; max-width: 0; overflow: hidden; white-space: nowrap; animation: type-word .55s cubic-bezier(.65,0,.35,1) .55s both; }
      .brand__dot { color: var(--flint-accent); opacity: 0; animation: dot-pulse 1.05s ease-in-out 1.1s infinite; }
      .bottom { position: absolute; inset: auto 0 0; height: 142px; padding: 22px 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .loading, .error-prompt { width: 100%; }
      .loading[hidden], .error-prompt[hidden] { display: none; }
      .progress { width: 100%; height: 5px; overflow: hidden; border: 1px solid rgba(112,91,95,.4); border-radius: 999px; background: rgba(255,255,255,.025); }
      .progress__bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f5a422 0%, #dd8515 38%, #c04711 74%, #ac1b0d 100%); box-shadow: 0 0 12px rgba(221,133,21,.5); transition: width .2s ease; }
      .progress__bar.is-indeterminate { width: 38%; animation: slide 1.35s ease-in-out infinite; }
      .status { margin-top: 12px; color: #939198; font-size: 12px; font-weight: 500; text-align: center; }
      .version { margin-top: 7px; color: #5e5960; font-size: 10px; text-align: center; }
      .prompt { display: flex; flex-direction: column; align-items: center; text-align: center; }
      .prompt__title { color: #f2f4f7; font-size: 13px; font-weight: 650; }
      .prompt__copy { max-width: 390px; margin-top: 5px; overflow: hidden; color: #8d8990; font-size: 11px; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
      .prompt__actions { display: flex; gap: 8px; margin-top: 12px; }
      .action { min-width: 104px; height: 31px; padding: 0 15px; border: 1px solid #343036; border-radius: 6px; background: #171519; color: #b7b2b8; font-size: 11px; font-weight: 600; cursor: pointer; }
      .action:hover:not(:disabled) { border-color: #51474b; background: #211d20; color: #fff; }
      .action--primary { border-color: color-mix(in oklab, var(--flint-accent) 70%, transparent); background: linear-gradient(180deg, var(--flint-accent), color-mix(in oklab, var(--flint-accent) 70%, #000)); color: #fff; box-shadow: 0 4px 14px color-mix(in oklab, var(--flint-accent) 30%, transparent); }
      .action:disabled { opacity: .55; cursor: default; }
      @keyframes type-word { to { max-width: 120px; } }
      @keyframes dot-pulse { 0%,100% { opacity: .22; text-shadow: 0 0 0 transparent; } 50% { opacity: 1; text-shadow: 0 0 12px color-mix(in oklab, var(--flint-accent) 90%, transparent); } }
      @keyframes logo-pop { from { opacity: 0; transform: translateY(7px) scale(.84); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes aura { 0%,100% { opacity: .62; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes slide { 0% { margin-left: -38%; } 55% { margin-left: 100%; } 100% { margin-left: 100%; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } .brand__word { max-width: 120px; } .brand__dot { opacity: 1; } }
    </style>
    <script>
      // Apply the user's saved accent before first paint. This window is served from
      // the same origin as the app, so it can read the ux prefs the app persists —
      // the accent hex is written for BOTH preset and custom themes, so one key
      // covers every case. Runs inline (not in updater.js) so there's no flash of
      // the fallback color. Any failure just leaves the CSS fallback in place.
      (function () {
        try {
          var raw = localStorage.getItem('flint_ux_prefs_v1');
          if (!raw) return;
          var accent = JSON.parse(raw).accentPrimary;
          if (typeof accent === 'string' && /^#[0-9a-fA-F]{6}$/.test(accent)) {
            // Mirror SUPERSEDED_DEFAULT_ACCENTS in uxStore.ts — this runs before the
            // app boots, so it can't reuse that map and must stay in sync with it.
            var superseded = { '#ef4444': '#EF5244', '#ef5b44': '#EF5244' };
            accent = superseded[accent.toLowerCase()] || accent;
            document.documentElement.style.setProperty('--flint-accent', accent);
          }
        } catch (e) { /* non-fatal — keep the fallback */ }
      })();
    </script>
  </head>
  <body>
    <main class="startup">
      <section class="visual">
        <div class="visual__aura"></div>
        <div class="brand">
          <img class="brand__logo" src="/flint-logo.png" width="512" height="512" alt="Flint" />
          <div class="brand__name"><span class="brand__word">Flint</span><span class="brand__dot">.</span></div>
        </div>
      </section>
      <section class="bottom">
        <div id="loading-view" class="loading">
          <div class="progress"><div id="progress-bar" class="progress__bar"></div></div>
          <div id="status" class="status">Preparing Flint interface...</div>
          <div id="version" class="version"></div>
        </div>
        <div id="error-view" class="error-prompt" hidden>
          <div class="prompt">
            <div class="prompt__title">Flint could not finish starting.</div>
            <div id="error-copy" class="prompt__copy">You can continue and check for updates later in Settings.</div>
            <div class="prompt__actions"><button id="continue-anyway" class="action action--primary" type="button">Continue</button></div>
          </div>
        </div>
      </section>
    </main>
    <script src="/updater.js"></script>
  </body>
</html>
